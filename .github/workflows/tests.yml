name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the lightweight packages the unit tests need. torch/ultralytics/kagglehub/
      # transformers are stubbed in tests/conftest.py, so no GPU or downloads.
      - name: Install test dependencies
        run: pip install pytest numpy opencv-python-headless pandas Pillow PyYAML matplotlib
      - name: Compile all scripts
        run: python -m py_compile scripts/*.py src/*.py
      - name: Run unit tests
        run: pytest -q
